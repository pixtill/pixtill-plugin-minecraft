name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: echo "PIXTILL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build versioned JAR
        run: ./gradlew clean :pixtill-all:shadowJar -Pversion=${PIXTILL_VERSION} --no-daemon --stacktrace

      - name: Publish release with JAR
        uses: softprops/action-gh-release@v2
        with:
          files: pixtill-all/build/libs/pixtill-${{ env.PIXTILL_VERSION }}.jar
          fail_on_unmatched_files: true
